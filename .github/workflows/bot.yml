name: FCPO Telegram Bot

on:
  schedule:
    - cron: "0 * * * *"  # Berjalan tepat setiap jam
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2  # Menggunakan versi terkini

      - name: Setup Python
        uses: actions/setup-python@v5.3.0  # Menggunakan versi terkini
        with:
          python-version: "3.x"

      - name: Install libraries
        run: |
          pip install requests feedparser

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

